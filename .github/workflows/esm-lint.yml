env:
  IMPORT_STATEMENT: import "webext-tools/does-tab-exist.js"

# FILE GENERATED WITH: npx ghat fregante/ghatemplates/esm-lint
# SOURCE: https://github.com/fregante/ghatemplates

name: ESM
on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - master
      - main
jobs:
  Pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install
      - run: npm run build --if-present
      - run: npm pack --dry-run
      - run: npm pack | tail -1 | xargs -n1 tar -xzf
      - uses: actions/upload-artifact@v7
        with:
          path: package
  Publint:
    runs-on: ubuntu-latest
    needs: Pack
    steps:
      - uses: actions/download-artifact@v7
      - run: npx publint ./artifact
  Webpack:
    runs-on: ubuntu-latest
    needs: Pack
    steps:
      - uses: actions/download-artifact@v7
      - run: npm install --omit=dev ./artifact
      - run: echo "$IMPORT_STATEMENT" > index.js
      - run: webpack --entry ./index.js
      - run: cat dist/main.js
  Parcel:
    runs-on: ubuntu-latest
    needs: Pack
    steps:
      - uses: actions/download-artifact@v7
      - run: npm install --omit=dev ./artifact
      - run: echo "$IMPORT_STATEMENT" > index.js
      - run: >
          echo '{"@parcel/resolver-default": {"packageExports": true}}' >
          package.json
      - run: npx parcel@2 build index.js
      - run: cat dist/index.js
  Rollup:
    runs-on: ubuntu-latest
    needs: Pack
    steps:
      - uses: actions/download-artifact@v7
      - run: npm install --omit=dev ./artifact rollup@4 @rollup/plugin-node-resolve
      - run: echo "$IMPORT_STATEMENT" > index.js
      - run: npx rollup -p node-resolve index.js
  Vite:
    runs-on: ubuntu-latest
    needs: Pack
    steps:
      - uses: actions/download-artifact@v7
      - run: npm install --omit=dev ./artifact
      - run: echo '<script type="module">$IMPORT_STATEMENT</script>' > index.html
      - run: npx vite build
      - run: cat dist/assets/*
  esbuild:
    runs-on: ubuntu-latest
    needs: Pack
    steps:
      - uses: actions/download-artifact@v7
      - run: echo '{}' > package.json
      - run: echo "$IMPORT_STATEMENT" > index.js
      - run: npm install --omit=dev ./artifact
      - run: npx esbuild --bundle index.js
  TypeScript:
    runs-on: ubuntu-latest
    needs: Pack
    steps:
      - uses: actions/download-artifact@v7
      - run: echo '{"type":"module"}' > package.json
      - run: npm install --omit=dev ./artifact @sindresorhus/tsconfig
      - run: echo "$IMPORT_STATEMENT" > index.ts
      - run: >
          echo '{"extends":"@sindresorhus/tsconfig","files":["index.ts"]}' >
          tsconfig.json
      - run: npx --package typescript -- tsc
      - run: cat distribution/index.js
  Node:
    runs-on: ubuntu-latest
    needs: Pack
    steps:
      - uses: actions/download-artifact@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: artifact/package.json
      - run: echo "$IMPORT_STATEMENT" > index.mjs
      - run: npm install --omit=dev ./artifact
      - run: node index.mjs
  Probe:
    runs-on: ubuntu-latest
    needs: Pack
    steps:
      - uses: actions/download-artifact@v7
      - {name: nested-package-json, continue-on-error: true, run: test -f artifact/package/package.json}
      - {name: root-package-json, continue-on-error: true, run: test -f artifact/package.json}
      - {name: root-readme, continue-on-error: true, run: test -f artifact/readme.md}
      - {name: root-distribution, continue-on-error: true, run: test -d artifact/distribution}
      - {name: nested-distribution, continue-on-error: true, run: test -d artifact/package/distribution}
      - {name: artifact-dir, continue-on-error: true, run: test -d artifact}
      - {name: top-level-package-json, continue-on-error: true, run: test -f package.json}
      - {name: top-level-package-dir, continue-on-error: true, run: test -f package/package.json}
